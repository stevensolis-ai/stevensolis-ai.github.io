<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="estilo.css">

<body>

    <header class="main-header">

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            links.forEach(function(link) {
